<script>

/* =========================================
   GET ELEMENTS
========================================= */

const buttons = [
  ...document.querySelectorAll(".question")
];

const title =
  document.getElementById("title");

const status =
  document.getElementById("status");

const video =
  document.getElementById("video");



/* =========================================
   LOAD VIDEO
========================================= */

function selectVideo(button) {

  /* Remove active state */

  buttons.forEach(b => {

    b.classList.remove("active");

  });


  /* Add active state */

  button.classList.add("active");


  /* Get Drive ID */

  const driveId = (
    button.dataset.driveId || ""
  ).trim();


  /* Get question title */

  const questionTitle =
    button.dataset.title || "";


  /* Update title */

  title.textContent =
    questionTitle;



  /* =========================================
     VIDEO NOT CONFIGURED
  ========================================= */

  if (!driveId) {

    status.textContent =
      "Not configured";


    video.innerHTML = `

      <div class="placeholder">

        <div>

          <strong>
            Video not configured
          </strong>

          <span>
            Add the Google Drive file ID in this page.
          </span>

        </div>

      </div>

    `;

    return;

  }



  /* =========================================
     VIDEO AVAILABLE
  ========================================= */


  /*
     Google Drive embedded player.

     autoplay=1 asks Google Drive to
     automatically start the video.
  */

  const driveUrl =
    "https://drive.google.com/file/d/"
    + encodeURIComponent(driveId)
    + "/preview?autoplay=1";



  video.innerHTML = `

    <iframe

      src="${driveUrl}"

      allow="autoplay; fullscreen"

      allowfullscreen

      title="${escapeHtml(questionTitle)}"

    ></iframe>

  `;

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text) {

  return text

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}



/* =========================================
   QUESTION CLICK
========================================= */

buttons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      selectVideo(button);

    }
  );

});



/* =========================================
   OPEN QUESTION 1 ON PAGE LOAD
========================================= */

selectVideo(buttons[0]);

</script>
